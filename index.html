<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto Web</title>
</head>
<body>
    <h1>Bienvenido/a a mi sitio web</h1>
    <p>Este es un proyecto para aprender Git y GitHub.</p>
    <!-- Añadir formulario de contacto -->
    <form action="#" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" required></textarea>
        <br>
        <button type="submit">Enviar</button>
    </form>
    <br>
    <!-- Tabla de horarios de clase -->
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Hora</th>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>08:00 - 09:00</td>
                <td>Matemáticas</td>
                <td>Castellano</td>
                <td>Física</td>
                <td>Química</td>
                <td>Historia</td>
            </tr>
            <tr>
                <td>09:00 - 10:00</td>
                <td>Castellano</td>
                <td>Matemáticas</td>
                <td>Historia</td>
                <td>Física</td>
                <td>Química</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
